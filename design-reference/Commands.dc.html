<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>ronn.ai Command Catalog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D10}
a{text-decoration:none}
</style>
</helmet>
<div style="width:100%; min-height:100vh; box-sizing:border-box; display:flex; flex-wrap:wrap; background:#0B0D10; color:#E6E8EB; font-family:'Inter',system-ui,sans-serif">

  <!-- SIDEBAR -->
  <aside style="flex:0 1 248px; box-sizing:border-box; padding:24px 16px; border-right:1px solid #1E242C; display:flex; flex-direction:column; gap:28px">
    <div style="display:flex; align-items:center; gap:10px; padding:0 8px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2"></circle><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19.1 4.9a10 10 0 0 1 0 14.2M4.9 19.1a10 10 0 0 1 0-14.2"></path></svg>
      <span style="font-weight:600; font-size:16px; letter-spacing:-0.01em">ronn<span style="color:{{accent}}">.ai</span></span>
    </div>

    <nav aria-label="Navigasi utama" style="display:flex; flex-direction:column; gap:20px">
      <div style="display:flex; flex-direction:column; gap:4px">
        <div style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.12em; color:#7D858F; padding:0 12px 6px">PUBLIK</div>
        <a href="Main.dc.html" style="display:flex; align-items:center; gap:12px; height:40px; padding:0 12px; border-radius:6px; font-size:14px; color:#8A929C">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2"></circle><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19.1 4.9a10 10 0 0 1 0 14.2M4.9 19.1a10 10 0 0 1 0-14.2"></path></svg>
          Radio Hub
        </a>
        <a href="Commands.dc.html" style="display:flex; align-items:center; gap:12px; height:40px; padding:0 12px; border-radius:6px; font-size:14px; background:#12161B; color:#E6E8EB">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
          Commands
        </a>
      </div>
      <div style="display:flex; flex-direction:column; gap:4px">
        <div style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.12em; color:#7D858F; padding:0 12px 6px">OWNER</div>
        <a href="Groups.dc.html" style="display:flex; align-items:center; gap:12px; height:40px; padding:0 12px; border-radius:6px; font-size:14px; color:#8A929C">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          Groups
          <svg style="margin-left:auto; color:#7D858F" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        </a>
        <a href="AICenter.dc.html" style="display:flex; align-items:center; gap:12px; height:40px; padding:0 12px; border-radius:6px; font-size:14px; color:#8A929C">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path><path d="M19 17v4M17 19h4"></path></svg>
          AI Center
          <svg style="margin-left:auto; color:#7D858F" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        </a>
        <a href="Observatory.dc.html" style="display:flex; align-items:center; gap:12px; height:40px; padding:0 12px; border-radius:6px; font-size:14px; color:#8A929C">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          Observatory
          <svg style="margin-left:auto; color:#7D858F" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        </a>
        <a href="Telemetry.dc.html" style="display:flex; align-items:center; gap:12px; height:40px; padding:0 12px; border-radius:6px; font-size:14px; color:#8A929C">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
          System
          <svg style="margin-left:auto; color:#7D858F" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Khusus owner"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        </a>
        <a href="Logs.dc.html" style="display:flex; align-items:center; gap:12px; height:40px; padding:0 12px; border-radius:6px; font-size:14px; color:#8A929C">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 6H3M21 12H3M15 18H3"></path></svg>
          Terminal
          <svg style="margin-left:auto; color:#7D858F" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Khusus owner"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        </a>
      </div>
    </nav>

    <div style="margin-top:auto; border:1px solid #1E242C; border-radius:8px; background:#12161B; padding:12px; display:flex; flex-direction:column; gap:10px">
      <div style="display:flex; align-items:center; gap:10px">
        <svg width="36" height="36" viewBox="0 0 36 36" style="flex:0 0 36px; border-radius:4px" aria-hidden="true"><rect width="36" height="36" fill="#141C26"></rect><circle cx="22" cy="13" r="7.5" fill="#DCE5E3"></circle><circle cx="25" cy="11" r="6.7" fill="#141C26"></circle></svg>
        <div style="flex:1; min-width:0">
          <div style="font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">Clair de Lune</div>
          <div style="font-size:12px; color:#8A929C; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">Claude Debussy</div>
        </div>
        <button aria-label="Jeda siaran" style="flex:0 0 44px; width:44px; height:44px; border-radius:50%; border:1px solid #2A323C; background:transparent; color:#E6E8EB; display:flex; align-items:center; justify-content:center; cursor:pointer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="4" height="16" rx="1"></rect><rect x="15" y="4" width="4" height="16" rx="1"></rect></svg>
        </button>
      </div>
      <div style="height:2px; background:#1E242C; border-radius:1px"><div style="width:33%; height:2px; background:{{accent}}; border-radius:1px"></div></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main style="flex:999 1 560px; min-width:0; box-sizing:border-box; padding:28px 40px 56px; display:flex; flex-direction:column; gap:24px">

    <header style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px">
      <h1 style="margin:0; font-size:20px; font-weight:600; letter-spacing:-0.01em">Command Catalog</h1>
      <span style="display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 12px; border:1px solid #2A323C; border-radius:999px; font-size:12px; color:#8A929C">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"></path></svg>
        Halaman publik
      </span>
    </header>

    <!-- SPOTLIGHT SEARCH -->
    <div style="display:flex; align-items:center; gap:14px; height:64px; padding:0 20px; box-sizing:border-box; border:1px solid #2A323C; border-radius:8px; background:#12161B">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A929C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input aria-label="Cari perintah bot" placeholder="Cari dari 108 perintah, alias, atau deskripsi" style="flex:1; min-width:0; background:transparent; border:0; outline:0; color:#E6E8EB; font-family:inherit; font-size:18px">
      <span style="display:inline-flex; align-items:center; height:28px; padding:0 8px; border:1px solid #2A323C; border-radius:4px; font-family:'JetBrains Mono',monospace; font-size:12px; color:#8A929C">Ctrl K</span>
    </div>

    <!-- CATEGORY FILTERS -->
    <div role="group" aria-label="Filter kategori" style="display:flex; flex-wrap:wrap; gap:8px">
      <sc-for list="{{cats}}" as="k" hint-placeholder-count="6">
        <button style="display:inline-flex; align-items:center; gap:8px; height:44px; padding:0 16px; border:1px solid {{k.border}}; border-radius:999px; background:{{k.bg}}; color:{{k.color}}; font-family:inherit; font-size:14px; cursor:pointer">
          {{k.label}}
          <span style="font-family:'JetBrains Mono',monospace; font-size:12px; color:{{k.countColor}}">{{k.count}}</span>
        </button>
      </sc-for>
    </div>

    <div style="font-family:'JetBrains Mono',monospace; font-size:12px; color:#8A929C">Menampilkan 9 dari 108 perintah</div>

    <!-- COMMAND CARDS -->
    <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:16px">
      <sc-for list="{{commands}}" as="c" hint-placeholder-count="9">
        <article style="display:flex; flex-direction:column; gap:14px; padding:20px; border:1px solid #1E242C; border-radius:8px; background:#12161B; box-sizing:border-box; min-width:0">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:12px">
            <h2 style="margin:0; font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:500">{{c.name}}</h2>
            <span style="display:inline-flex; align-items:center; height:24px; padding:0 8px; border:1px solid {{c.badgeBorder}}; border-radius:4px; font-size:12px; color:{{c.badgeColor}}; white-space:nowrap">{{c.access}}</span>
          </div>
          <div style="display:flex; flex-wrap:wrap; gap:6px">
            <sc-for list="{{c.aliases}}" as="a" hint-placeholder-count="2">
              <span style="display:inline-flex; align-items:center; height:22px; padding:0 8px; border:1px solid #2A323C; border-radius:4px; font-family:'JetBrains Mono',monospace; font-size:12px; color:#8A929C">{{a}}</span>
            </sc-for>
          </div>
          <p style="margin:0; font-size:14px; line-height:1.5; color:#8A929C">{{c.desc}}</p>
          <div style="display:flex; align-items:center; height:44px; margin-top:auto; border:1px solid #1E242C; border-radius:6px; background:#0B0D10; overflow:hidden">
            <code style="flex:1; min-width:0; padding:0 12px; font-family:'JetBrains Mono',monospace; font-size:13px; color:#E6E8EB; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">{{c.usage}}</code>
            <button aria-label="Copy syntax {{c.name}}" style="display:inline-flex; align-items:center; gap:6px; height:44px; padding:0 14px; border:0; border-left:1px solid #1E242C; background:transparent; color:{{c.copyColor}}; font-family:'JetBrains Mono',monospace; font-size:12px; cursor:pointer">
              <sc-if value="{{c.copied}}" hint-placeholder-val="{{ false }}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </sc-if>
              <sc-if value="{{c.idle}}" hint-placeholder-val="{{ true }}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              </sc-if>
              {{c.copyText}}
            </button>
          </div>
        </article>
      </sc-for>
    </div>

  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7FD1C7","options":["#7FD1C7","#C9B6FF","#E8C27A"]},"$preview":{"width":1440,"height":1320}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#7FD1C7';
    const pub = { access: 'Public', badgeColor: '#7BC8A0', badgeBorder: '#2F4A3D' };
    const adm = { access: 'Admin Grup', badgeColor: '#E0B46A', badgeBorder: '#4D4128' };
    const own = { access: 'Master Owner', badgeColor: '#E8909A', badgeBorder: '#52303A' };
    const raw = [
      { name: '.play', aliases: ['.p', '.putar'], desc: 'Putar lagu ke siaran radio. Lagu masuk antrean dan muncul di Radio Hub.', usage: '.play clair de lune', ...pub },
      { name: '.ai', aliases: ['.ask', '.tanya'], desc: 'Tanya AI. Router memilih tier model sesuai kompleksitas pertanyaan.', usage: '.ai jelaskan apa itu kernel panic', ...pub, copied: true },
      { name: '.code', aliases: ['.kode'], desc: 'Bantu tulis atau debug kode, lengkap dengan penjelasan singkat.', usage: '.code buat fungsi debounce di JS', ...pub },
      { name: '.sticker', aliases: ['.s', '.stiker'], desc: 'Ubah gambar atau video pendek menjadi stiker WhatsApp.', usage: 'balas gambar dengan .sticker', ...pub },
      { name: '.ytmp3', aliases: ['.mp3'], desc: 'Unduh audio dari tautan dan kirim sebagai pesan suara atau file.', usage: '.ytmp3 <tautan>', ...pub },
      { name: '.kick', aliases: ['.tendang'], desc: 'Keluarkan anggota dari grup. Hanya bisa dipakai admin grup.', usage: '.kick @anggota', ...adm },
      { name: '.tagall', aliases: ['.everyone'], desc: 'Mention seluruh anggota grup dengan satu pesan pengumuman.', usage: '.tagall rapat jam 8 malam', ...adm },
      { name: '.restart', aliases: ['.rs'], desc: 'Restart proses bot. Sesi WhatsApp akan tersambung ulang otomatis.', usage: '.restart', ...own },
      { name: '.broadcast', aliases: ['.bc'], desc: 'Kirim pesan ke semua grup yang terdaftar. Pakai dengan hati-hati.', usage: '.broadcast <pesan>', ...own }
    ];
    const commands = raw.map((c) => ({
      ...c,
      copied: !!c.copied,
      idle: !c.copied,
      copyText: c.copied ? 'Copied' : 'Copy',
      copyColor: c.copied ? accent : '#8A929C'
    }));
    const catDefs = [
      ['Semua', 108], ['AI & Code', 24], ['Media & Stiker', 31], ['Entertainment', 22], ['Group Admin', 17], ['Tools & Utility', 14]
    ];
    const cats = catDefs.map((d, i) => ({
      label: d[0],
      count: d[1],
      border: i === 0 ? accent : '#2A323C',
      bg: i === 0 ? '#12161B' : 'transparent',
      color: i === 0 ? '#E6E8EB' : '#8A929C',
      countColor: i === 0 ? accent : '#7D858F'
    }));
    return { accent, commands, cats };
  }
}
</script>
</body>
</html>
